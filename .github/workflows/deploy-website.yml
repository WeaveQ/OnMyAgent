# Deploy website/ only (landing + VitePress docs) to GitHub Pages.
# Does NOT run on desktop/app changes — only website/** and this workflow file.
name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # website is a workspace package; filter avoids full monorepo build tools
      - name: Install website deps
        run: pnpm install --filter @onmyagent/website...

      - name: Build site
        working-directory: website
        env:
          # Project Pages: https://<org>.github.io/<repo>/
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
