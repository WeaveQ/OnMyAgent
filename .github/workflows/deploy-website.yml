# Deploy website/ only (landing + VitePress docs) to GitHub Pages.
# Does NOT run on desktop/app changes — only website/** and this workflow file.
name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-website
  # Newest deploy wins. Queue mode (false) stacked multiple Pages deploys that
  # each sat in deployment_in_progress ~10m and hit deploy-pages' default timeout.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # website is a workspace package; filter avoids full monorepo app builds
      - name: Install website deps
        run: pnpm install --filter @onmyagent/website...

      - name: Build site
        working-directory: website
        env:
          # Project Pages: https://<org>.github.io/<repo>/
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages poll can exceed 10m when Pages is slow; give the job headroom
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000 (10m). Successful deploys here often take ~10m of
          # deployment_in_progress alone; raise so slow Pages does not false-fail.
          timeout: 1200000
