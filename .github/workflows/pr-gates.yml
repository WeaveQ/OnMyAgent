# PR metadata gates: English collaboration text + public privacy shapes.
# Product UI copy stays multi-language via i18n. Signing identities stay in
# Actions secrets / a private runbook — never in this repo.
name: PR Gates

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-gates:
    name: PR English + Privacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Collect commit subjects
        id: commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SUBJECTS=$(git log --format=%s "${BASE_SHA}..${HEAD_SHA}" | sed '/^$/d' || true)
          {
            echo "subjects<<EOF"
            printf '%s\n' "$SUBJECTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check PR title, body, and commits are English
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS: ${{ steps.commits.outputs.subjects }}
        run: node scripts/checks/pr-english.mjs

      - name: Check public text for signing identities and secrets
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS: ${{ steps.commits.outputs.subjects }}
        run: node scripts/checks/pr-privacy.mjs --scan
