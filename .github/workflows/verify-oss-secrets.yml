name: Verify OSS Secrets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-oss-secrets.yml"
      - "scripts/release/sync-oss-update-feed.mjs"

permissions:
  contents: read

jobs:
  probe:
    name: Probe Aliyun OSS credentials
    runs-on: ubuntu-latest
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Upload and fetch a tiny probe object
        run: node scripts/release/sync-oss-update-feed.mjs --probe
