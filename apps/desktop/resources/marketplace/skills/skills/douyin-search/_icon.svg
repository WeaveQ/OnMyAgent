<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="dy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161823"/>
      <stop offset="1" stop-color="#0D0E15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#dy-bg)"/>

  <!-- Douyin-style eighth note with offset glitch: cyan shadow + magenta shadow + white core -->
  <!-- Note stem -->
  <rect x="16.5" y="6" width="2.4" height="13" fill="#FE2C55" opacity="0.9" transform="translate(-0.7,0)"/>
  <rect x="16.5" y="6" width="2.4" height="13" fill="#25F4EE" opacity="0.9" transform="translate(0.7,0)"/>
  <rect x="16.5" y="6" width="2.4" height="13" fill="#fff"/>

  <!-- Note flag (top bar) -->
  <path d="M18.9,6 q3.5,1 4,4.5 q-2.5,-1.8 -4,-1.3 z" fill="#FE2C55" opacity="0.9" transform="translate(-0.7,0)"/>
  <path d="M18.9,6 q3.5,1 4,4.5 q-2.5,-1.8 -4,-1.3 z" fill="#25F4EE" opacity="0.9" transform="translate(0.7,0)"/>
  <path d="M18.9,6 q3.5,1 4,4.5 q-2.5,-1.8 -4,-1.3 z" fill="#fff"/>

  <!-- Note head (bottom oval) -->
  <ellipse cx="14" cy="19" rx="4.2" ry="3.2" fill="#FE2C55" opacity="0.9" transform="translate(-0.7,0)"/>
  <ellipse cx="14" cy="19" rx="4.2" ry="3.2" fill="#25F4EE" opacity="0.9" transform="translate(0.7,0)"/>
  <ellipse cx="14" cy="19" rx="4.2" ry="3.2" fill="#fff"/>

  <!-- Search magnifying glass (bottom-right, small) -->
  <circle cx="24" cy="24" r="3.6" fill="none" stroke="#25F4EE" stroke-width="1.8"/>
  <line x1="26.8" y1="26.8" x2="29" y2="29" stroke="#25F4EE" stroke-width="2" stroke-linecap="round"/>
</svg>
