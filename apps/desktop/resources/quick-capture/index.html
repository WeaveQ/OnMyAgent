<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Quick Capture</title>
  <style>
    /* Align with DESIGN.md dark tokens + command-palette restraint */
    :root {
      color-scheme: dark;
      --surface: #2c2c2c;
      --surface-muted: #333333;
      --background: #1f1f1f;
      --border: #3a3a3a;
      --border-strong: #4a4a4a;
      --text: #f8fafc;
      --secondary: #94a3b8;
      --primary: #2f7bff;
      --primary-hover: #5b96ff;
      --danger: #f87171;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }
    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 0;
      -webkit-app-region: drag;
    }
    .top-label {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--secondary);
      letter-spacing: 0.01em;
    }
    .context {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 62%;
      -webkit-app-region: no-drag;
    }
    .chip {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: var(--secondary);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .chip.ws::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 5px;
      border-radius: 50%;
      background: #28b276;
      vertical-align: 0.05em;
    }
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 10px 14px 12px;
      -webkit-app-region: no-drag;
    }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 72px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      line-height: 1.45;
      font-family: inherit;
      -webkit-user-select: text;
      user-select: text;
    }
    textarea::placeholder { color: #64748b; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
    }
    .hint kbd {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--secondary);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 5px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .error {
      font-size: 11px;
      color: var(--danger);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .error:empty { display: none; }
    .send {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border-radius: 8px;
      height: 32px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.12s ease, opacity 0.12s ease;
    }
    .send:hover:not(:disabled) { background: var(--primary-hover); }
    .send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .send svg {
      width: 14px;
      height: 14px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top">
      <div class="top-label">快捷对话</div>
      <div class="context">
        <span class="chip ws" id="workspaceLabel">—</span>
        <span class="chip" id="modelLabel">默认模型</span>
      </div>
    </div>
    <div class="body">
      <textarea
        id="input"
        placeholder="描述任务，Enter 派发到工作区…"
        autofocus
        rows="3"
      ></textarea>
      <div class="bar">
        <div class="hint"><kbd>Enter</kbd> 发送 · <kbd>Esc</kbd> 关闭</div>
        <div class="actions">
          <span class="error" id="error"></span>
          <button type="button" class="send" id="sendBtn" disabled aria-label="派发">
            派发
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const errorEl = document.getElementById("error");
    const workspaceLabel = document.getElementById("workspaceLabel");
    const modelLabel = document.getElementById("modelLabel");
    let submitting = false;

    function applyContext(ctx) {
      if (!ctx) return;
      workspaceLabel.textContent =
        (ctx.workspaceLabel && String(ctx.workspaceLabel).trim()) || "未选择工作区";
      modelLabel.textContent =
        (ctx.modelLabel && String(ctx.modelLabel).trim()) || "默认模型";
    }

    function setError(msg) {
      errorEl.textContent = msg || "";
    }

    function syncSendEnabled() {
      sendBtn.disabled = submitting || !(input.value || "").trim();
    }

    async function submit() {
      if (submitting) return;
      const text = (input.value || "").trim();
      if (!text) {
        setError("请输入内容");
        input.focus();
        return;
      }
      submitting = true;
      syncSendEnabled();
      setError("");
      try {
        const result = await window.quickCapture.submit({ text, mode: "agent" });
        if (!result || result.ok === false) {
          const err = (result && result.error) || "派发失败";
          setError(
            err === "empty"
              ? "请输入内容"
              : err === "no-main-window"
                ? "主窗口未就绪"
                : String(err),
          );
          submitting = false;
          syncSendEnabled();
          return;
        }
        input.value = "";
        submitting = false;
        syncSendEnabled();
      } catch (e) {
        setError(e && e.message ? e.message : "派发失败");
        submitting = false;
        syncSendEnabled();
      }
    }

    sendBtn.addEventListener("click", () => void submit());
    input.addEventListener("input", syncSendEnabled);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        void window.quickCapture.close();
        return;
      }
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        void submit();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        void window.quickCapture.close();
      }
    });

    if (window.quickCapture) {
      window.quickCapture.onContext?.(applyContext);
      window.quickCapture.onFocus?.(() => {
        submitting = false;
        setError("");
        syncSendEnabled();
        input.focus();
        input.select();
      });
      window.quickCapture.getContext?.().then(applyContext).catch(() => undefined);
    }

    syncSendEnabled();
    input.focus();
  </script>
</body>
</html>
