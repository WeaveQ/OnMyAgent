<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Quick Capture</title>
  <style>
    :root,
    html[data-theme="dark"] {
      color-scheme: dark;
      --surface: #2c2c2c;
      --surface-muted: #3a3a3a;
      --surface-elevated: #404040;
      --border: #4a4a4a;
      --text: #f8fafc;
      --secondary: #94a3b8;
      --placeholder: #64748b;
      --primary: #2f7bff;
      --primary-hover: #5b96ff;
      --primary-soft: rgba(47, 123, 255, 0.16);
      --danger: #f87171;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      --option-hover: rgba(255, 255, 255, 0.06);
      --option-active: rgba(47, 123, 255, 0.2);
      --chevron: #94a3b8;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --surface: #ffffff;
      --surface-muted: #f4f4f5;
      --surface-elevated: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --secondary: #71717a;
      --placeholder: #a1a1aa;
      --primary: #2f7bff;
      --primary-hover: #1d6ef0;
      --primary-soft: rgba(47, 123, 255, 0.12);
      --danger: #dc2626;
      --shadow: 0 16px 48px rgba(15, 23, 42, 0.14);
      --option-hover: rgba(24, 24, 27, 0.05);
      --option-active: rgba(47, 123, 255, 0.12);
      --chevron: #71717a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }
    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      /* visible so the model menu can extend past the header without clipping */
      overflow: visible;
      position: relative;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 0;
      -webkit-app-region: drag;
    }
    .top-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }
    .model-wrap {
      min-width: 0;
      max-width: 62%;
      -webkit-app-region: no-drag;
      position: relative;
    }
    .model-trigger {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-width: 132px;
      height: 32px;
      padding: 0 10px 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      outline: none;
      cursor: pointer;
      /* Do not clip the chevron — only the label ellipsizes. */
      overflow: visible;
    }
    .model-trigger:hover:not(:disabled) {
      border-color: color-mix(in srgb, var(--primary) 40%, var(--border));
    }
    .model-trigger:focus-visible {
      border-color: rgba(47, 123, 255, 0.55);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .model-trigger:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .model-trigger-label {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      line-height: 32px;
    }
    .model-trigger-caret {
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
      margin-left: 2px;
      position: relative;
      color: var(--chevron);
      transition: transform 0.12s ease, color 0.12s ease;
    }
    /* CSS triangle — always visible even if SVG fails to paint. */
    .model-trigger-caret::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      margin-left: -5px;
      margin-top: -2px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 6px solid currentColor;
    }
    .model-wrap.open .model-trigger-caret {
      transform: rotate(180deg);
      color: var(--text);
    }
    .model-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 20;
      min-width: 100%;
      width: max-content;
      max-width: min(280px, 70vw);
      max-height: 180px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      box-shadow: var(--shadow);
      -webkit-app-region: no-drag;
    }
    .model-wrap.open .model-menu {
      display: block;
    }
    .model-option {
      display: block;
      width: 100%;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .model-option:hover:not(:disabled),
    .model-option[data-active="true"] {
      background: var(--option-hover);
    }
    .model-option[data-selected="true"] {
      background: var(--option-active);
      color: var(--primary);
    }
    .model-option:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .model-empty {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--secondary);
    }
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px 16px 14px;
      -webkit-app-region: no-drag;
    }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 88px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      line-height: 1.5;
      font-family: inherit;
      -webkit-user-select: text;
      user-select: text;
    }
    textarea::placeholder { color: var(--placeholder); font-size: 16px; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .hint {
      font-size: 12px;
      color: var(--placeholder);
    }
    .hint kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 11px;
      color: var(--secondary);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .error {
      font-size: 12px;
      color: var(--danger);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .error:empty { display: none; }
    .send {
      appearance: none;
      border: none;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      border-radius: 999px;
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease, opacity 0.12s ease, transform 0.08s ease;
      flex-shrink: 0;
    }
    .send:hover:not(:disabled) { background: var(--primary-hover); }
    .send:active:not(:disabled) { transform: scale(0.96); }
    .send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .send svg {
      width: 16px;
      height: 16px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top">
      <div class="top-label">快捷对话</div>
      <div class="model-wrap" id="modelWrap">
        <button
          type="button"
          class="model-trigger"
          id="modelTrigger"
          aria-label="选择模型"
          aria-haspopup="listbox"
          aria-expanded="false"
          disabled
        >
          <span class="model-trigger-label" id="modelTriggerLabel">默认模型</span>
          <span class="model-trigger-caret" aria-hidden="true" title="展开模型列表"></span>
        </button>
        <div class="model-menu" id="modelMenu" role="listbox" aria-label="模型列表" hidden></div>
      </div>
    </div>
    <div class="body">
      <textarea
        id="input"
        placeholder="描述任务，Enter 派发到工作区…"
        autofocus
        rows="3"
      ></textarea>
      <div class="bar">
        <div class="hint"><kbd>Enter</kbd> 发送 · <kbd>Esc</kbd> 关闭</div>
        <div class="actions">
          <span class="error" id="error"></span>
          <button type="button" class="send" id="sendBtn" disabled aria-label="发送" title="发送">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const errorEl = document.getElementById("error");
    const modelWrap = document.getElementById("modelWrap");
    const modelTrigger = document.getElementById("modelTrigger");
    const modelTriggerLabel = document.getElementById("modelTriggerLabel");
    const modelMenu = document.getElementById("modelMenu");
    let submitting = false;
    /** @type {{ providerID: string, modelID: string, title: string, disabled?: boolean }[]} */
    let modelOptions = [];
    /** @type {string} */
    let selectedModelKey = "";

    function modelKey(providerID, modelID) {
      return `${providerID || ""}::${modelID || ""}`;
    }

    function parseModelKey(value) {
      const raw = String(value || "");
      const idx = raw.indexOf("::");
      if (idx < 0) return null;
      const providerID = raw.slice(0, idx).trim();
      const modelID = raw.slice(idx + 2).trim();
      if (!providerID || !modelID) return null;
      return { providerID, modelID };
    }

    function applyTheme(theme) {
      const resolved = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.style.colorScheme = resolved;
    }

    function closeModelMenu() {
      modelWrap.classList.remove("open");
      modelTrigger.setAttribute("aria-expanded", "false");
      modelMenu.hidden = true;
    }

    function openModelMenu() {
      if (modelTrigger.disabled) return;
      modelWrap.classList.add("open");
      modelTrigger.setAttribute("aria-expanded", "true");
      modelMenu.hidden = false;
      const selected = modelMenu.querySelector('[data-selected="true"]');
      if (selected && typeof selected.scrollIntoView === "function") {
        selected.scrollIntoView({ block: "nearest" });
      }
    }

    function toggleModelMenu() {
      if (modelWrap.classList.contains("open")) closeModelMenu();
      else openModelMenu();
    }

    function setSelectedModel(key, title) {
      selectedModelKey = key || "";
      modelTriggerLabel.textContent = title || "默认模型";
      for (const btn of modelMenu.querySelectorAll(".model-option")) {
        btn.setAttribute(
          "data-selected",
          btn.dataset.value === selectedModelKey ? "true" : "false",
        );
      }
    }

    function renderModelMenu() {
      modelMenu.innerHTML = "";
      if (!modelOptions.length) {
        const empty = document.createElement("div");
        empty.className = "model-empty";
        empty.textContent = "暂无可用模型";
        modelMenu.appendChild(empty);
        modelTrigger.disabled = true;
        return;
      }
      modelTrigger.disabled = false;
      for (const m of modelOptions) {
        const key = modelKey(m.providerID, m.modelID);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "model-option";
        btn.role = "option";
        btn.dataset.value = key;
        btn.textContent = m.title || m.modelID;
        btn.disabled = m.disabled === true;
        btn.setAttribute(
          "data-selected",
          key === selectedModelKey ? "true" : "false",
        );
        btn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (btn.disabled) return;
          setSelectedModel(key, m.title || m.modelID);
          closeModelMenu();
          input.focus();
        });
        modelMenu.appendChild(btn);
      }
    }

    function applyContext(ctx) {
      if (!ctx) return;
      if (ctx.theme === "light" || ctx.theme === "dark") {
        applyTheme(ctx.theme);
      }

      const models = Array.isArray(ctx.models) ? ctx.models : [];
      modelOptions = models
        .map((m) => ({
          providerID: String(m.providerID || "").trim(),
          modelID: String(m.modelID || "").trim(),
          title: String(m.title || m.modelID || "").trim(),
          disabled: m.disabled === true,
        }))
        .filter((m) => m.providerID && m.modelID);

      const preferred =
        ctx.selectedModelKey ||
        (ctx.selectedProviderID && ctx.selectedModelID
          ? modelKey(ctx.selectedProviderID, ctx.selectedModelID)
          : "");

      let nextKey = "";
      let nextTitle = "";
      if (modelOptions.some((m) => modelKey(m.providerID, m.modelID) === preferred)) {
        const hit = modelOptions.find(
          (m) => modelKey(m.providerID, m.modelID) === preferred,
        );
        nextKey = preferred;
        nextTitle = (hit && (hit.title || hit.modelID)) || preferred;
      } else if (modelOptions.length) {
        nextKey = modelKey(modelOptions[0].providerID, modelOptions[0].modelID);
        nextTitle = modelOptions[0].title || modelOptions[0].modelID;
      } else {
        nextTitle = (ctx.modelLabel && String(ctx.modelLabel).trim()) || "默认模型";
      }

      renderModelMenu();
      setSelectedModel(nextKey, nextTitle);
      closeModelMenu();
    }

    function setError(msg) {
      errorEl.textContent = msg || "";
    }

    function syncSendEnabled() {
      sendBtn.disabled = submitting || !(input.value || "").trim();
    }

    async function submit() {
      if (submitting) return;
      const text = (input.value || "").trim();
      if (!text) {
        setError("请输入内容");
        input.focus();
        return;
      }
      submitting = true;
      syncSendEnabled();
      setError("");
      closeModelMenu();
      const model = parseModelKey(selectedModelKey);
      try {
        const result = await window.quickCapture.submit({
          text,
          mode: "agent",
          model: model || undefined,
        });
        if (!result || result.ok === false) {
          const err = (result && result.error) || "派发失败";
          setError(
            err === "empty"
              ? "请输入内容"
              : err === "no-main-window"
                ? "主窗口未就绪"
                : String(err),
          );
          submitting = false;
          syncSendEnabled();
          return;
        }
        input.value = "";
        submitting = false;
        syncSendEnabled();
      } catch (e) {
        setError(e && e.message ? e.message : "派发失败");
        submitting = false;
        syncSendEnabled();
      }
    }

    sendBtn.addEventListener("click", () => void submit());
    input.addEventListener("input", syncSendEnabled);

    modelTrigger.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      toggleModelMenu();
    });
    modelWrap.addEventListener("mousedown", (e) => e.stopPropagation());
    modelMenu.addEventListener("mousedown", (e) => e.stopPropagation());

    document.addEventListener("mousedown", (event) => {
      if (!modelWrap.contains(event.target)) closeModelMenu();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        if (modelWrap.classList.contains("open")) {
          closeModelMenu();
          return;
        }
        void window.quickCapture.close();
        return;
      }
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        void submit();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        if (modelWrap.classList.contains("open")) {
          closeModelMenu();
          modelTrigger.focus();
          return;
        }
        void window.quickCapture.close();
      }
    });

    if (window.quickCapture) {
      window.quickCapture.onContext?.(applyContext);
      window.quickCapture.onFocus?.(() => {
        submitting = false;
        setError("");
        syncSendEnabled();
        closeModelMenu();
        input.focus();
        input.select();
      });
      window.quickCapture.getContext?.().then(applyContext).catch(() => undefined);
    }

    syncSendEnabled();
    input.focus();
  </script>
</body>
</html>
