<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Quick Capture</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14161b;
      --elevated: #1b1e26;
      --input: #12141a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #f4f5f7;
      --muted: #9aa0ab;
      --dim: #6b7280;
      --accent: #3b82f6;
      --accent-hover: #4b8ff7;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --success: #34d399;
      --danger: #f87171;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }
    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 12px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 24px 64px rgba(0, 0, 0, 0.45);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      -webkit-app-region: drag;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .logo {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: linear-gradient(145deg, #3b82f6 0%, #60a5fa 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }
    .hotkey {
      font-size: 11px;
      color: var(--dim);
      font-family: var(--mono);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      -webkit-app-region: no-drag;
    }
    .modes {
      display: none; /* Agent-only MVP; hide unused todo tab */
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 92px;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input);
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.5;
      padding: 12px 14px;
      font-family: inherit;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      -webkit-app-region: no-drag;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    textarea:focus {
      border-color: rgba(59, 130, 246, 0.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea::placeholder { color: var(--dim); }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      -webkit-app-region: no-drag;
    }
    .context {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
      flex: 1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.7);
      flex-shrink: 0;
    }
    .pill.model { color: var(--dim); }
    .send {
      border: 0;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.32);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.12s ease, transform 0.08s ease;
      flex-shrink: 0;
    }
    .send:hover:not(:disabled) { background: var(--accent-hover); }
    .send:active:not(:disabled) { transform: scale(0.98); }
    .send:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      box-shadow: none;
    }
    .send .arrow {
      font-size: 14px;
      opacity: 0.9;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 12px;
      -webkit-app-region: no-drag;
    }
    .hints {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--dim);
    }
    .hints span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    kbd {
      font-family: var(--mono);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.4;
    }
    .error {
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--danger);
      min-height: 0;
      line-height: 1.35;
      -webkit-app-region: no-drag;
    }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="brand"><span class="logo">O</span>快速捕获</div>
      <span class="hotkey" id="hotkeyHint">⌘B</span>
    </div>
    <div class="subtitle">发送到当前工作区，创建新任务并派发给 Agent</div>
    <textarea id="input" placeholder="例如：总结本周进度，并生成明天站会提纲…" autofocus></textarea>
    <div class="meta">
      <div class="context">
        <span class="pill"><span class="dot"></span><span id="workspaceLabel">—</span></span>
        <span class="pill model" id="modelPill"><span id="modelLabel">默认模型</span></span>
      </div>
      <button type="button" class="send" id="sendBtn">
        派发
        <span class="arrow">↵</span>
      </button>
    </div>
    <div class="error" id="error"></div>
    <div class="footer">
      <div class="hints">
        <span><kbd>Enter</kbd> 发送</span>
        <span><kbd>⇧</kbd><kbd>Enter</kbd> 换行</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const errorEl = document.getElementById("error");
    const workspaceLabel = document.getElementById("workspaceLabel");
    const modelLabel = document.getElementById("modelLabel");
    const hotkeyHint = document.getElementById("hotkeyHint");
    let submitting = false;

    function applyContext(ctx) {
      if (!ctx) return;
      workspaceLabel.textContent =
        (ctx.workspaceLabel && String(ctx.workspaceLabel).trim()) || "未选择工作区";
      modelLabel.textContent =
        (ctx.modelLabel && String(ctx.modelLabel).trim()) || "默认模型";
      if (ctx.hotkeyLabel && String(ctx.hotkeyLabel).trim()) {
        hotkeyHint.textContent = String(ctx.hotkeyLabel).trim();
      }
    }

    function setError(msg) {
      errorEl.textContent = msg || "";
    }

    function syncSendEnabled() {
      if (submitting) {
        sendBtn.disabled = true;
        return;
      }
      sendBtn.disabled = !(input.value || "").trim();
    }

    async function submit() {
      if (submitting) return;
      const text = (input.value || "").trim();
      if (!text) {
        setError("请输入任务内容");
        input.focus();
        return;
      }
      submitting = true;
      syncSendEnabled();
      setError("");
      try {
        const result = await window.quickCapture.submit({ text, mode: "agent" });
        if (!result || result.ok === false) {
          const err = (result && result.error) || "派发失败";
          setError(
            err === "empty"
              ? "请输入任务内容"
              : err === "no-main-window"
                ? "主窗口未就绪，请先打开 OnMyAgent"
                : String(err),
          );
          submitting = false;
          syncSendEnabled();
          return;
        }
        input.value = "";
        // Panel closes via main process; reset for next open.
        submitting = false;
        syncSendEnabled();
      } catch (e) {
        setError(e && e.message ? e.message : "派发失败");
        submitting = false;
        syncSendEnabled();
      }
    }

    sendBtn.addEventListener("click", () => void submit());
    input.addEventListener("input", syncSendEnabled);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        void window.quickCapture.close();
        return;
      }
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        void submit();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        void window.quickCapture.close();
      }
    });

    if (window.quickCapture) {
      window.quickCapture.onContext?.(applyContext);
      window.quickCapture.onFocus?.(() => {
        submitting = false;
        setError("");
        syncSendEnabled();
        input.focus();
        input.select();
      });
      window.quickCapture.getContext?.().then(applyContext).catch(() => undefined);
    }

    syncSendEnabled();
    input.focus();
  </script>
</body>
</html>
