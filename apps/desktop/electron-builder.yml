# IMPORTANT: appId intentionally matches the previous Tauri shell so both
# builds share the same macOS bundle identifier, keychain entries, Launchpad
# slot, and TCC permissions. In-place migration from Tauri to Electron
# depended on this; the migration is now complete and this identifier is
# retained for continuity.
appId: com.differentai.onmyagent
productName: OnMyAgent
protocols:
  - name: OnMyAgent
    schemes:
      - onmyagent
directories:
  output: dist-electron
  buildResources: build
files:
  - electron/**/*
  - server/**/*
  - package.json
  # Frameless quick-capture panel (⌘B). loadFile needs these next to electron/ in asar.
  - from: resources/quick-capture
    to: resources/quick-capture
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: resources/bundled-skills
    to: bundled-skills
  - from: resources/bundled-plugins
    to: bundled-plugins
  - from: resources/marketplace
    to: marketplace
  - from: resources/browser
    to: browser
  - from: resources/runtimes
    to: runtimes
    filter:
      - "**/node/**"
      - "**/python/**"
      - "**/versions.json"
  - from: resources/artifact-runtime
    to: artifact-runtime
    filter:
      - "**/*"
      - "!**/*.{map,md,ts}"
      - "!**/*.test.cjs"
      - "!**/node_modules/@types/**"
      - "!**/.pnpm/@types+*/**"
      - "!**/exceljs/dist/**"
      - "!**/pdf-lib/dist/**"
      - "!**/pdf-lib/es/**"
      - "!**/pdf-lib/src/**"
      - "!**/pdf-lib/ts3.4/**"
      - "!**/jszip/dist/**"
  # Window / tray icon fallback in packaged app (desktop-paths resolveAppIconPath).
  - from: resources/icons
    to: icons
    filter:
      - icon.png
      - icon.ico
  # Fallback path when asar unpack / path resolution needs process.resourcesPath.
  - from: resources/quick-capture
    to: quick-capture
asar: true
npmRebuild: false
# Chromium ships dozens of locale packs. Product UI is en / zh-CN / zh-TW.
electronLanguages:
  - en
  - en-US
  - zh-CN
  - zh-TW
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# electron-updater generic feed (Aliyun OSS). CI still uploads GitHub copies
# separately via scripts/release/publish-electron-assets.mjs.
publish:
  - provider: generic
    url: https://weaveq-onmyagent.oss-cn-hangzhou.aliyuncs.com/onmyagent
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  # Hardened Runtime stays on for both Developer ID and ad-hoc local builds.
  # Ad-hoc: set identity to "-" (see package:electron:local) and keep the
  # entitlements below so Electron/Chromium JIT + native modules do not crash.
  # Release: CI sets CSC_NAME from the repository secret (common name only).
  # electron-builder 26 rejects the "Developer ID Application:" prefix and
  # adds the type itself.
  # Enable MACOS_NOTARIZE=true after notary API secrets are configured.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  # Skip signing large DATA-only resource trees to keep packaging fast.
  # Frameworks' Resources are intentionally NOT ignored: Squirrel.framework's
  # ShipIt binary lives there and notarization requires it signed (Developer ID
  # + secure timestamp + hardened runtime).
  signIgnore:
    - '/Contents/Resources/(?:app-dist|artifact-runtime|browser|bundled-plugins|bundled-skills|marketplace)/'
    - '/Contents/Resources/runtimes/[^/]+/python/(?!bin/python(?:3(?:[.][0-9]+)?)?$)(?!.*[.](?:so|dylib)$).*'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OnMyAgent may use the microphone when a feature needs microphone access.
    # Required for Privacy → Automation entries / prompts (Hardened Runtime + AE).
    NSAppleEventsUsageDescription: OnMyAgent sends commands to other apps (for example Calendar, Reminders, and Notes) when you ask your agent to automate them.
  # Ship short alias sidecars only (prepare-sidecar writes TARGET arch into
  # opencode / onmyagent-orchestrator / versions.json). Do not pack
  # opencode-<triple> duplicates or the other arch — they inflate notarization
  # zip size. afterPack also enforces alias-only + single-runtime-triple keep.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - onmyagent-orchestrator
        - versions.json
    - from: resources/helpers
      to: helpers
      filter:
        - "OnMyAgent Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/icon.png
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - onmyagent-orchestrator
        - versions.json
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  # Must be true so rcedit stamps OnMyAgent icon + FileDescription into the exe.
  # Without this, Explorer/shortcuts keep the stock Electron icon/metadata.
  # Authenticode signing still only runs when CSC_* secrets are configured.
  signAndEditExecutable: true
  executableName: OnMyAgent
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - onmyagent-orchestrator.exe
        - versions.json
  target:
    - nsis
# Assisted installer wizard (Next → choose folder → Install → Finish).
# Default electron-builder NSIS is oneClick=true (single-button install).
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: OnMyAgent
  deleteAppDataOnUninstall: false
  # Paths relative to buildResources (directories.buildResources = build).
  # Icons are copied into build/ during packaging prep; keep repo copies in resources/icons.
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  include: installer.nsh
  runAfterFinish: true
  menuCategory: false
artifactName: onmyagent-${os}-${arch}-${version}.${ext}
