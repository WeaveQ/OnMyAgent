<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnMyAgent</title>

    <link rel="icon" type="image/png" href="/onmyagent-logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("onmyagent.react.settings.theme-mode") || localStorage.getItem("onmyagent.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <!--
      Electron reveals the native window as soon as this document can paint,
      which is earlier than the external CSS bundle and React entry module.
      Keep this tiny first frame self-contained so cold starts never expose an
      empty root while the application bundle is being parsed.
    -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #fff; color: #0f172a; font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html[data-theme="dark"] body { background: #2c2c2c; color: #f8fafc; }
      .onmyagent-static-boot { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: inherit; }
      /* Hero monogram + quiet progress. Mark uses a soft ring spinner (common load pattern). */
      .onmyagent-static-boot__content { display: flex; width: 100%; max-width: 24rem; flex-direction: column; align-items: center; gap: 3rem; padding: 2.5rem 2rem; text-align: center; }
      .onmyagent-static-boot__mark {
        position: relative; display: flex; width: 9.5rem; height: 9.5rem;
        align-items: center; justify-content: center; border: 0; background: transparent;
      }
      .onmyagent-static-boot__ring {
        position: absolute; inset: 0; border-radius: 999px; pointer-events: none;
        border: 1.5px solid rgba(0, 93, 255, 0.1);
        border-top-color: rgba(0, 93, 255, 0.65);
        border-right-color: rgba(0, 93, 255, 0.22);
        animation: onmyagent-static-boot-spin 1.05s linear infinite;
      }
      .onmyagent-static-boot__mark img {
        display: block; width: 6.75rem; height: 6.75rem; object-fit: contain;
        animation: onmyagent-static-boot-breathe 2.6s ease-in-out infinite;
      }
      /* Status copy only — ring spinner already signals loading. */
      .onmyagent-static-boot__message { color: #94a3b8; font-size: .8125rem; line-height: 1.25rem; letter-spacing: .01em; }
      html[data-theme="dark"] .onmyagent-static-boot__message { color: #9ca3af; }
      html[data-theme="dark"] .onmyagent-static-boot__ring {
        border-color: rgba(127, 176, 255, 0.12);
        border-top-color: rgba(127, 176, 255, 0.7);
        border-right-color: rgba(127, 176, 255, 0.25);
      }
      @keyframes onmyagent-static-boot-spin { to { transform: rotate(360deg); } }
      @keyframes onmyagent-static-boot-breathe {
        0%, 100% { opacity: .92; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.025); }
      }
      @media (prefers-reduced-motion: reduce) {
        .onmyagent-static-boot__ring { animation: none; opacity: .45; }
        .onmyagent-static-boot__mark img { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root"></div>
    <!-- Sibling, not a child of #root: createRoot clears #root before its first commit. -->
    <div id="onmyagent-static-boot" class="onmyagent-static-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="onmyagent-static-boot__content">
        <div class="onmyagent-static-boot__mark" aria-hidden="true">
          <span class="onmyagent-static-boot__ring"></span>
          <!-- Compact brand monogram (not the 2k product logo) for first paint. -->
          <img
            src="/onmyagent-boot-mark.png"
            width="128"
            height="128"
            alt=""
            draggable="false"
          />
        </div>
        <div class="onmyagent-static-boot__message">Starting OnMyAgent…</div>
      </div>
    </div>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
