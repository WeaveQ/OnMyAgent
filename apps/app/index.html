<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnMyAgent</title>

    <link rel="icon" type="image/png" href="/onmyagent-logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("onmyagent.react.settings.theme-mode") || localStorage.getItem("onmyagent.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <!--
      Electron reveals the native window as soon as this document can paint,
      which is earlier than the external CSS bundle and React entry module.
      Keep this tiny first frame self-contained so cold starts never expose an
      empty root while the application bundle is being parsed.
    -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #fff; color: #0f172a; font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html[data-theme="dark"] body { background: #2c2c2c; color: #f8fafc; }
      .onmyagent-static-boot { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: inherit; }
      /* Generous vertical rhythm: hero mark → product name → quiet progress */
      .onmyagent-static-boot__content { display: flex; width: 100%; max-width: 24rem; flex-direction: column; align-items: center; gap: 2.75rem; padding: 2.5rem 2rem; text-align: center; }
      .onmyagent-static-boot__mark { display: flex; width: 7.5rem; height: 7.5rem; align-items: center; justify-content: center; border: 0; background: transparent; box-shadow: none; }
      html[data-theme="dark"] .onmyagent-static-boot__mark { background: transparent; }
      .onmyagent-static-boot__status { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
      .onmyagent-static-boot__title { font-size: 1.0625rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.4; }
      .onmyagent-static-boot__progress { display: flex; flex-direction: column; align-items: center; gap: .875rem; }
      .onmyagent-static-boot__dots { display: flex; gap: .5rem; height: .75rem; align-items: center; }
      .onmyagent-static-boot__dot { width: .3125rem; height: .3125rem; border-radius: 999px; background: #94a3b8; animation: onmyagent-static-boot-pulse 1.35s ease-in-out infinite; }
      .onmyagent-static-boot__dot:nth-child(2) { animation-delay: .18s; }
      .onmyagent-static-boot__dot:nth-child(3) { animation-delay: .36s; }
      .onmyagent-static-boot__message { color: #94a3b8; font-size: .8125rem; line-height: 1.25rem; letter-spacing: .01em; }
      html[data-theme="dark"] .onmyagent-static-boot__dot { background: #6b7280; }
      html[data-theme="dark"] .onmyagent-static-boot__message { color: #9ca3af; }
      @keyframes onmyagent-static-boot-pulse { 0%, 80%, 100% { opacity: .22; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .onmyagent-static-boot__dot { animation: none; opacity: .55; } }
    </style>
  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root"></div>
    <!-- Sibling, not a child of #root: createRoot clears #root before its first commit. -->
    <div id="onmyagent-static-boot" class="onmyagent-static-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="onmyagent-static-boot__content">
        <div class="onmyagent-static-boot__mark" aria-hidden="true">
          <!-- Compact brand monogram (not the 2k product logo) for first paint. -->
          <img
            src="/onmyagent-boot-mark.png"
            width="112"
            height="112"
            alt=""
            draggable="false"
            style="display:block;width:6.5rem;height:6.5rem;object-fit:contain"
          />
        </div>
        <div class="onmyagent-static-boot__status">
          <div class="onmyagent-static-boot__title">OnMyAgent</div>
          <div class="onmyagent-static-boot__progress">
            <div class="onmyagent-static-boot__dots" aria-hidden="true"><span class="onmyagent-static-boot__dot"></span><span class="onmyagent-static-boot__dot"></span><span class="onmyagent-static-boot__dot"></span></div>
            <div class="onmyagent-static-boot__message">Starting OnMyAgent…</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
